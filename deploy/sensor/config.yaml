controller:
  url: https://controller.example.com
sensor:
  name: edge-sensor
agent:
  # Prefer C2HUNTER_ENROLLMENT_TOKEN in /etc/c2hunter-sensor/environment.
  state_file: /var/lib/c2hunter-sensor/state/agent.json
  config_poll_interval_seconds: 1
  # on_demand opens AF_PACKET only while the Controller reports an active
  # LIVE analysis job. Use continuous only when historical flow analysis is
  # intentionally required and the storage/retention impact is acceptable.
  capture_mode: on_demand
capture_sources: []
# Raw packets are persisted only while a LIVE analysis with Store PCAP enabled is active.
# Finalized segments are linked to that analysis, uploaded through the authenticated
# controller connection, and appear in the Web UI under Sensor PCAPs.
internal_networks: []
batch:
  max_items: 1000
  max_bytes: 1048576
capture:
  job_id: continuous
  packet_queue_size: 4096
  # 0 disables payload retention. Set 1..256 only on sensors where analysts
  # are permitted to preview bounded payload bytes in the Controller UI.
  payload_preview_bytes: 0
spool:
  directory: /var/lib/c2hunter-sensor/spool
  max_bytes: 1073741824
  max_age_seconds: 86400
pcap:
  directory: /var/lib/c2hunter-sensor/pcap
  max_segment_bytes: 134217728
  max_segment_duration_seconds: 300
  max_disk_bytes: 1073741824
  queue_size: 4096
