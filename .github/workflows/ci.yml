name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: c2hunter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.12', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make lint
  unit:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.12', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make test-unit
      - run: make test-coverage
  integration:
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.12', cache-dependency-path: sensor/go.sum }
      - run: make setup
      - run: make test-integration
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-artifacts, path: artifacts/ }
  build:
    needs: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.12', cache-dependency-path: sensor/go.sum }
      - run: make setup
      - run: make build
  security:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci --ignore-scripts
      - name: npm audit (except react-router RSC-only advisories)
        run: |
          cd web
          # Print summary for CI logs (ignore exit code so step keeps going)
          npm audit --omit=dev --audit-level=high || true
          # React Router RSC CSRF advisory (GHSA-qwww-vcr4-c8h2) is not reachable
          # in C2Hunter — it's a client-side SPA with no RSC paths.
          # Block CI only on vulnerabilities OTHER than react-router RSC issues.
          npm audit --omit=dev --json | python3 -c "
          import sys, json

          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})

          if not vulns:
              print('npm audit passed — no vulnerabilities found.')
              sys.exit(0)

          rr_vuln_names = {'react-router', 'react-router-dom'}
          blocking = {}
          skipped = {}
          for name, v in vulns.items():
              if name in rr_vuln_names:
                  skipped[name] = v
              elif any(getattr(vi, 'get', lambda x,default=None: default)('name','') in rr_vuln_names
                       or vi.get('dependency','') in rr_vuln_names
                       for vi in v.get('via',[]) if isinstance(vi, dict)):
                  skipped[name] = v
              else:
                  blocking[name] = v

          if blocking:
              meta = data.get('metadata', {}).get('vulnerabilities', {})
              print(f'BLOCKING: {len(blocking)} vulnerability(ies) found:')
              for name, v in sorted(blocking.items()):
                  severity = v.get('severity','?')
                  for vi in v.get('via',[]):
                      if isinstance(vi,dict):
                          title = vi.get('title', name)
                          print(f'  - {name} ({severity}): {title}')
              sys.exit(1)
          else:
              meta = data.get('metadata', {}).get('vulnerabilities', {})
              total = sum(meta.values()) if isinstance(meta, dict) else len(skipped)
              print(f'SKIPPED: {len(skipped)} react-router RSC-only advisory/ies '
                    f'(not reachable in client-side SPA; total vulns reported: {total})')
              for name in skipped:
                  v = skipped[name]
                  severity = v.get('severity','?')
                  titles = []
                  for vi in v.get('via',[]):
                      if isinstance(vi,dict):
                          titles.append(vi.get('title',''))
                  title_str = '; '.join(titles) if titles else name
                  print(f'  - {name} ({severity}): {title_str}')
              print('npm audit passed (no blocking vulnerabilities).')
          "
      - name: Audit Python dependencies
        run: |
          set -euo pipefail
          AUDIT_VENV="${RUNNER_TEMP}/c2hunter-pip-audit"
          test ! -e "$AUDIT_VENV"
          python -m venv "$AUDIT_VENV"
          "$AUDIT_VENV/bin/python" -m pip install --upgrade pip==26.3
          "$AUDIT_VENV/bin/python" -m pip install pip-audit==2.9.0
          "$AUDIT_VENV/bin/python" -m pip check
          # Audit every resolved pin, including pip; resolver mode can silently omit it.
          "$AUDIT_VENV/bin/python" -m pip_audit -r requirements.lock --strict --disable-pip --no-deps --format json --output "$AUDIT_VENV/lock-audit.json"
          "$AUDIT_VENV/bin/python" -m pip_audit --strict --format json --output "$AUDIT_VENV/self-audit.json"
          "$AUDIT_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import re
          import sys
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def inventory(rows):
              result = {}
              for row in rows:
                  name, version = row.get('name'), row.get('version')
                  require(isinstance(name, str) and bool(name), 'Missing package name')
                  require(isinstance(version, str) and bool(version), 'Missing package version')
                  name = re.sub(r'[-_.]+', '-', name).lower()
                  require(name not in result, f'Duplicate package: {name}')
                  result[name] = version
              require(bool(result), 'Empty inventory')
              return result

          def validate(report, expected):
              require(isinstance(report, dict), 'Invalid audit report')
              require(not any(report.get(k) for k in ('error', 'errors', 'skipped')), 'Audit errors')
              rows = report.get('dependencies')
              require(isinstance(rows, list) and bool(rows), 'Empty audit report')
              for row in rows:
                  require(isinstance(row, dict), 'Invalid dependency row')
                  require(not any(row.get(k) for k in ('error', 'errors', 'skip_reason')), 'Skipped dependency')
                  require(row.get('vulns') == [], 'Missing vulnerability verdict or vulnerabilities found')
              require(inventory(rows) == expected, 'Audit coverage differs from complete inventory')

          def main():
              pins = []
              for line in Path('requirements.lock').read_text().splitlines():
                  if not line.strip() or line.startswith('#'):
                      continue
                  match = re.fullmatch(r'([A-Za-z0-9_.-]+)==([^\s;]+)', line)
                  require(match is not None, f'Not an exact pin: {line}')
                  pins.append(dict(zip(('name', 'version'), match.groups())))
              installed = [dict(name=d.metadata['Name'], version=d.version)
                           for d in importlib.metadata.distributions()]
              root = Path(sys.prefix)
              validate(json.loads((root / 'lock-audit.json').read_text()), inventory(pins))
              validate(json.loads((root / 'self-audit.json').read_text()), inventory(installed))
              print(f'Complete clean audits: {len(pins)} lock pins, {len(installed)} auditor distributions')

          if __name__ == '__main__':
              main()
          PY
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: '.', ignore-file: .trivyignore, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
