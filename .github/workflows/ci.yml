        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make test-unit-worker 2>&1 | tee artifacts/ci/unit-worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-unit-worker-${{ github.run_attempt }}
          include-hidden-files: true
          path: artifacts/
  unit-tools:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - name: Run test-unit-tools
        timeout-minutes: 330
