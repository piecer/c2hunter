        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make test-unit-web 2>&1 | tee artifacts/ci/unit-web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-unit-web-${{ github.run_attempt }}
          include-hidden-files: true
          path: artifacts/
  coverage-controller:
    needs: shard-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan-${{ github.run_attempt }}
          path: artifacts/ci-shards
      - name: Measure complete Controller coverage partition
        env:
          CI_SHARD: '${{ matrix.shard }}'
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make ci-test-coverage-controller 2>&1 | tee artifacts/ci/coverage-controller.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-coverage-controller-${{ github.run_attempt }}-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: artifacts/ci-shards/controller-coverage-${{ matrix.shard }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-coverage-controller-log-${{ github.run_attempt }}-${{ matrix.shard }}
          include-hidden-files: true
          path: artifacts/ci/
  coverage-controller-merge:
    needs: [shard-plan, coverage-controller]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan-${{ github.run_attempt }}
          path: artifacts/ci-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-coverage-controller-${{ github.run_attempt }}-*
          merge-multiple: false
          path: artifacts/ci-shards/downloaded-controller-coverage
      - name: Require complete raw union and Controller coverage floor
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make ci-merge-coverage-controller 2>&1 | tee artifacts/ci/coverage-controller-merge.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-coverage-controller-merge-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/
