name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: c2hunter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - name: Run lint
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make lint 2>&1 | tee artifacts/ci/lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-lint-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci --ignore-scripts
        timeout-minutes: 330
      - name: npm audit (except react-router RSC-only advisories)
        timeout-minutes: 330
        run: |
          cd web
          # Print summary for CI logs (ignore exit code so step keeps going)
          npm audit --omit=dev --audit-level=high || true
          # React Router RSC CSRF advisory (GHSA-qwww-vcr4-c8h2) is not reachable
          # in C2Hunter — it's a client-side SPA with no RSC paths.
          # Block CI only on vulnerabilities OTHER than react-router RSC issues.
          npm audit --omit=dev --json | python3 -c "
          import sys, json

          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})

          if not vulns:
              print('npm audit passed — no vulnerabilities found.')
              sys.exit(0)

          rr_vuln_names = {'react-router', 'react-router-dom'}
          blocking = {}
          skipped = {}
          for name, v in vulns.items():
              if name in rr_vuln_names:
                  skipped[name] = v
              elif any(getattr(vi, 'get', lambda x,default=None: default)('name','') in rr_vuln_names
                       or vi.get('dependency','') in rr_vuln_names
                       for vi in v.get('via',[]) if isinstance(vi, dict)):
                  skipped[name] = v
              else:
                  blocking[name] = v

          if blocking:
              meta = data.get('metadata', {}).get('vulnerabilities', {})
              print(f'BLOCKING: {len(blocking)} vulnerability(ies) found:')
              for name, v in sorted(blocking.items()):
                  severity = v.get('severity','?')
                  for vi in v.get('via',[]):
                      if isinstance(vi,dict):
                          title = vi.get('title', name)
                          print(f'  - {name} ({severity}): {title}')
              sys.exit(1)
          else:
              meta = data.get('metadata', {}).get('vulnerabilities', {})
              total = sum(meta.values()) if isinstance(meta, dict) else len(skipped)
              print(f'SKIPPED: {len(skipped)} react-router RSC-only advisory/ies '
                    f'(not reachable in client-side SPA; total vulns reported: {total})')
              for name in skipped:
                  v = skipped[name]
                  severity = v.get('severity','?')
                  titles = []
                  for vi in v.get('via',[]):
                      if isinstance(vi,dict):
                          titles.append(vi.get('title',''))
                  title_str = '; '.join(titles) if titles else name
                  print(f'  - {name} ({severity}): {title_str}')
              print('npm audit passed (no blocking vulnerabilities).')
          "
      - name: Audit Python dependencies
        timeout-minutes: 330
        run: |
          set -euo pipefail
          AUDIT_VENV="${RUNNER_TEMP}/c2hunter-pip-audit"
          test ! -e "$AUDIT_VENV"
          python -m venv "$AUDIT_VENV"
          "$AUDIT_VENV/bin/python" -m pip install --upgrade pip==26.3
          "$AUDIT_VENV/bin/python" -m pip install pip-audit==2.9.0
          "$AUDIT_VENV/bin/python" -m pip check
          # Audit every resolved pin, including pip; resolver mode can silently omit it.
          "$AUDIT_VENV/bin/python" -m pip_audit -r requirements.lock --strict --disable-pip --no-deps --format json --output "$AUDIT_VENV/lock-audit.json"
          "$AUDIT_VENV/bin/python" -m pip_audit --strict --format json --output "$AUDIT_VENV/self-audit.json"
          "$AUDIT_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import re
          import sys
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def inventory(rows):
              result = {}
              for row in rows:
                  name, version = row.get('name'), row.get('version')
                  require(isinstance(name, str) and bool(name), 'Missing package name')
                  require(isinstance(version, str) and bool(version), 'Missing package version')
                  name = re.sub(r'[-_.]+', '-', name).lower()
                  require(name not in result, f'Duplicate package: {name}')
                  result[name] = version
              require(bool(result), 'Empty inventory')
              return result

          def validate(report, expected):
              require(isinstance(report, dict), 'Invalid audit report')
              require(not any(report.get(k) for k in ('error', 'errors', 'skipped')), 'Audit errors')
              rows = report.get('dependencies')
              require(isinstance(rows, list) and bool(rows), 'Empty audit report')
              for row in rows:
                  require(isinstance(row, dict), 'Invalid dependency row')
                  require(not any(row.get(k) for k in ('error', 'errors', 'skip_reason')), 'Skipped dependency')
                  require(row.get('vulns') == [], 'Missing vulnerability verdict or vulnerabilities found')
              require(inventory(rows) == expected, 'Audit coverage differs from complete inventory')

          def main():
              pins = []
              for line in Path('requirements.lock').read_text().splitlines():
                  if not line.strip() or line.startswith('#'):
                      continue
                  match = re.fullmatch(r'([A-Za-z0-9_.-]+)==([^\s;]+)', line)
                  require(match is not None, f'Not an exact pin: {line}')
                  pins.append(dict(zip(('name', 'version'), match.groups())))
              installed = [dict(name=d.metadata['Name'], version=d.version)
                           for d in importlib.metadata.distributions()]
              root = Path(sys.prefix)
              validate(json.loads((root / 'lock-audit.json').read_text()), inventory(pins))
              validate(json.loads((root / 'self-audit.json').read_text()), inventory(installed))
              print(f'Complete clean audits: {len(pins)} lock pins, {len(installed)} auditor distributions')

          if __name__ == '__main__':
              main()
          PY
      - uses: gitleaks/gitleaks-action@v2
        timeout-minutes: 330
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        timeout-minutes: 330
        with: { scan-type: fs, scan-ref: '.', ignore-file: .trivyignore, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-security-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/
            ${{ runner.temp }}/c2hunter-pip-audit/*-audit.json
  shard-plan:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - name: Collect complete inventories and plan time-balanced shards
        env:
          CI_PYTEST_EVIDENCE: '1'
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make ci-plan 2>&1 | tee artifacts/ci/shard-plan.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-shard-plan-${{ github.run_attempt }}
          if-no-files-found: error
          path: artifacts/ci-shards/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-shard-plan-log-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/
  python:
    needs: shard-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan-${{ github.run_attempt }}
          path: artifacts/ci-shards
      - name: Run complete plain Python partition
        env:
          CI_SHARD: '${{ matrix.shard }}'
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make ci-test-python 2>&1 | tee artifacts/ci/python.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-python-${{ github.run_attempt }}-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: artifacts/ci-shards/plain-${{ matrix.shard }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-python-log-${{ github.run_attempt }}-${{ matrix.shard }}
          include-hidden-files: true
          path: artifacts/ci/
  python-verify:
    needs: [shard-plan, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan-${{ github.run_attempt }}
          path: artifacts/ci-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-python-${{ github.run_attempt }}-*
          merge-multiple: false
          path: artifacts/ci-shards/downloaded-plain
      - name: Require exact plain inventory completion
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make ci-verify-python 2>&1 | tee artifacts/ci/python-verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-python-verify-${{ github.run_attempt }}
          include-hidden-files: true
          path: artifacts/
  unit-go:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
        timeout-minutes: 330
      - name: Run test-unit-go
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make test-unit-go 2>&1 | tee artifacts/ci/unit-go.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-unit-go-${{ github.run_attempt }}
          include-hidden-files: true
          path: artifacts/
