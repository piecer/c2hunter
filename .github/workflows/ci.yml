  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - run: make setup
        timeout-minutes: 330
      - name: Run build
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          make build 2>&1 | tee artifacts/ci/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-build-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/
  ci:
    if: always()
    needs: [lint, security, shard-plan, python, python-verify, unit-go, unit-worker, unit-tools, unit-web, coverage-controller, coverage-controller-merge, coverage-analysis, coverage-sensor, scenarios, e2e, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          expected = {
              'lint', 'security', 'shard-plan', 'python', 'python-verify',
              'unit-go', 'unit-worker', 'unit-tools', 'unit-web',
              'coverage-controller', 'coverage-controller-merge', 'coverage-analysis',
              'coverage-sensor', 'scenarios', 'e2e', 'build',
          }
          needs = json.loads(os.environ['NEEDS_JSON'])
          if not isinstance(needs, dict) or set(needs) != expected:
              sys.exit('Missing or unexpected CI jobs')
          failed = [name for name in sorted(expected)
                    if not isinstance(needs[name], dict) or needs[name].get('result') != 'success']
          if failed:
              sys.exit('CI jobs did not succeed: ' + ', '.join(failed))
          print('All required CI jobs, shard reconciliation and coverage floors succeeded')
          PY
