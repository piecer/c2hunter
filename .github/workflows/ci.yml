    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: sensor/go.sum }
      - uses: actions/setup-node@v4
