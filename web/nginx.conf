server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500m;
    client_body_timeout 600s;

    location = /healthz {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Docker service addresses can change after container recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $controller_backend controller:8000;
        proxy_pass http://$controller_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header X-Request-ID $request_id;
        # Preserve the client chain; the controller trusts it only from configured proxy CIDRs.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}
